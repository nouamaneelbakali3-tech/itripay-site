<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{sent_title}} — ItriPay</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A63E6">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/{{preload_font}}" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/site.css">
<script src="/site.js" defer></script>
</head>
<body class="sent">
<!-- L'page dyal l'naja7 bla JS: Web3Forms kayredirecti hna mn be3d POST
     3adi. B JS l'ta7ir ma-kaywselch hna: l'naja7 kaybane f l'form nafso.
     Nfs l'sma dyal l'hero: l'nejma kat-trsem, w l'nojoum f l'canvas. -->
<svg class="sprite" aria-hidden="true"><defs>
<g id="ip-blade"><path d="M0 -588 L119 -221 Q132 -171 94 -138 L34 -91 Q14 -76 22 -46 L-297 -298 L-176 -252 Q-116 -231 -98 -286 Z" fill="currentColor"/><path d="M0 -588 V-232 Q0 -176 -52 -172 Q-70 -171 -88 -181 L-297 -298 L-176 -252 Q-116 -231 -98 -286 Z" fill="rgba(4,18,56,.15)"/></g>
<path id="ip-outline" pathLength="1" d="M0 -588 L119 -221 Q132 -171 94 -138 L34 -91 Q14 -76 22 -46 L-297 -298 L-176 -252 Q-116 -231 -98 -286 Z"/>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</defs></svg>

<header class="site-head"><div class="wrap">
  <div class="brand">
    <button type="button" class="logo-spin" aria-label="{{spin_label}}"><svg class="star draw" viewBox="-640 -640 1280 1280" aria-hidden="true"><g><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g><g transform="rotate(90)"><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g><g transform="rotate(180)"><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g><g transform="rotate(270)"><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g></svg></button>
    <a href="/{{lang}}/" class="wordmark">ItriPay</a>
  </div>
</div></header>

<main id="main" class="hero sent-hero">
  <canvas class="sky" aria-hidden="true"></canvas><div class="aurora" aria-hidden="true"></div>
  <div class="wrap sent-c">
    <div class="sent-star up" style="--i:0"><div class="rot"><svg class="star draw" viewBox="-640 -640 1280 1280" aria-hidden="true"><g><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g><g transform="rotate(90)"><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g><g transform="rotate(180)"><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g><g transform="rotate(270)"><g class="blade"><use class="b-body" href="#ip-blade"/><use class="b-line" href="#ip-outline"/></g></g></svg></div></div>
    <p class="chip on-sky up" style="--i:2"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>{{sent_chip}}</p>
    <h1 class="sent-title up" style="--i:3">{{sent_title}}</h1>
    <p class="hero-sub up" style="--i:4">{{sent_body}}</p>
    <p class="up" style="--i:5"><a class="btn btn-primary" href="/{{lang}}/"><span>{{sent_back}}</span><svg class="ic ar" aria-hidden="true"><use href="#i-arrow"/></svg></a></p>
    <p class="sent-mail up" style="--i:6">{{footer_contact_label}}: <a href="mailto:{{contact_email}}">{{contact_email}}</a></p>
  </div>
</main>
</body>
</html>
