<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced at build time by `flutter build web --base-href /demo/`.
    The path has to start and end with a slash.
  -->
  <base href="/demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ItriPay demo: SoftPOS for Moroccan merchants. Sample data, simulated payments.">
  <meta name="robots" content="noindex">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ItriPay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ItriPay Demo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Phone frame on wide screens, full screen on phones.
    Flutter renders into #app (hostElement in flutter_bootstrap.js),
    so the app's own layout sees a phone-sized viewport on desktop.
    No external stylesheet or font: the demo makes no third-party
    requests (see lib/core/demo.dart).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #F8F9FA; }
    #app { position: fixed; inset: 0; }

    @media (min-width: 600px) and (min-height: 720px) {
      body {
        background: radial-gradient(circle at 50% 35%, #1E3A8A 0%, #0B1E4D 70%);
        display: flex; align-items: center; justify-content: center;
      }
      #phone {
        position: relative;
        width: 390px; height: min(844px, calc(100vh - 48px));
        padding: 14px;
        border-radius: 56px;
        background: #0F172A;
        box-shadow: 0 0 0 2px #334155, 0 30px 80px rgba(0, 0, 0, .55);
      }
      #app {
        position: relative; inset: auto;
        width: 100%; height: 100%;
        border-radius: 42px; overflow: hidden;
        background: #F8F9FA;
      }
    }
  </style>
</head>
<body>
  <div id="phone"><div id="app"></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
